version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wechat_bot_postgres
    environment:
      POSTGRES_DB: wechat_bot
      POSTGRES_USER: bot_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wechat_bot_secure_password_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_admin -d wechat_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wechat_bot_network

  redis:
    image: redis:7-alpine
    container_name: wechat_bot_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - wechat_bot_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat_bot_backend
    environment:
      DATABASE_URL: postgresql://bot_admin:${DB_PASSWORD:-wechat_bot_secure_password_2024}@postgres:5432/wechat_bot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_that_should_be_at_least_32_characters_long}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - wechat_bot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wechat_bot_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - wechat_bot_network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: wechat_bot
    environment:
      DATABASE_URL: postgresql://bot_admin:${DB_PASSWORD:-wechat_bot_secure_password_2024}@postgres:5432/wechat_bot
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WECHATY_TOKEN: ${WECHATY_TOKEN:-}
      WECHATY_PUPPET: ${WECHATY_PUPPET:-wechaty-puppet-donut}
      BACKEND_URL: http://backend:8000
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2000}
      MESSAGE_CACHE_TTL: ${MESSAGE_CACHE_TTL:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - wechat_bot_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wechat_bot_network:
    driver: bridge
